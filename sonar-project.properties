# SonarQube project metadata
sonar.projectKey=sonarqube-lab
sonar.projectName=sonarqube-lab
sonar.projectVersion=1.0

# Replace the URL below with your SonarQube server URL
sonar.host.url=http://localhost:9000

# Replace with the actual SonarQube token generated in SonarQube
sonar.token=YOUR_SONAR_TOKEN

# Source settings
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
